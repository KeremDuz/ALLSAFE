map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # This listener is reachable only through host loopback/Tailscale HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 660s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location = /downloads/PhishCatch-ALLSAFE-1.1.0.apk {
        root /usr/share/nginx;
        try_files $uri =404;
        autoindex off;
        disable_symlinks on;
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="PhishCatch-ALLSAFE-1.1.0.apk"';
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
    location = /downloads { return 404; }
    location ^~ /downloads/ { return 404; }

    location = /admin { return 308 /admin/; }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A new release must not leave an old endpoint or service worker cached.
    location ~ (?:^|/)(?:index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }
}
