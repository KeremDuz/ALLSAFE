# Funnel terminates HTTPS. Do not trust browser-supplied IP/identity headers.
# Shared limits deliberately bound all anonymous traffic, not spoofable X-Forwarded-For.
limit_req_zone $server_name zone=consumer_rate:1m rate=6r/m;
limit_conn_zone $server_name zone=consumer_active:1m;

server {
    listen 18181;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    access_log off;
    client_max_body_size 12k;
    client_body_timeout 10s;
    send_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;

    location = /api/v1/public/analyze {
        limit_except POST { deny all; }
        limit_req zone=consumer_rate burst=2 nodelay;
        limit_req_status 429;
        limit_conn consumer_active 1;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:9000/api/v1/public/analyze;
        proxy_http_version 1.1;
        proxy_set_header Host phishcatch;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Integration-Key "";
        proxy_set_header X-CSRF-Token "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_buffering on;
    }
    location = /downloads/PhishCatch-1.1.1.apk {
        root /usr/share/nginx;
        disable_symlinks on;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="PhishCatch-1.1.1.apk"';
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = / { try_files /index.html =404; }
    # Only known Flutter static files and bundles; every API/admin/health path is denied.
    location ~ ^/(?:assets|canvaskit|icons)/[A-Za-z0-9_./@-]+$ {
        disable_symlinks on;
        try_files $uri =404;
    }
    location ~ ^/(?:index\.html|main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json|favicon\.png|brand\.svg)$ {
        try_files $uri =404;
    }
    location / { return 404; }
}
