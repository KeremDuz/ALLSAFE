# Gives the API loopback Wazuh URLs (its configuration allows plain HTTP only on loopback) and
# forwards them over the wazuh stack's network. Upstream TLS is always verified:
#   Server API: Wazuh's self-signed API certificate, issued for "localhost"
#   Indexer:    the wazuh stack's root CA, certificate name "wazuh.indexer"
server {
    listen 127.0.0.1:55001;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $upstream https://wazuh.manager:55000;
        proxy_pass $upstream;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/wazuh/api.crt;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 127.0.0.1:9201;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $upstream https://wazuh.indexer:9200;
        proxy_pass $upstream;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/wazuh/root-ca.pem;
        proxy_ssl_name wazuh.indexer;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
