# Gives the API a loopback PhishCatch URL (its configuration allows plain HTTP only on loopback)
# and forwards to the PhishCatch integration edge over the shared phishcatch-link network.
server {
    listen 127.0.0.1:9000;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/v1/integrations/allsafe/ {
        set $upstream http://phishcatch-integration:18190;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }
    location / { return 404; }
}
