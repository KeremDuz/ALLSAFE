# Managed by deploy/server/deploy.sh in the ALLSAFE repository; edit it there, not on the server.
# ALLSAFE Core and the private panel/mobile web client (Tailscale Serve :443 -> 127.0.0.1:18180).
# PhishCatch is reached through the phishcatch-link network (phishcatch-link.conf) and Wazuh
# through the wazuh stack's network (wazuh-link.conf); both appear on the API's loopback.
# Server-local files next to this one: .env (secrets), wazuh-api.crt and wazuh-root-ca.pem
# (public certificates copied from the wazuh stack; see deploy/server/README.md).
name: allsafe

x-api: &api
  image: allsafe-api:${RELEASE:?Set RELEASE in release.env}
  environment:
    ALLSAFE_ENVIRONMENT: development
    ALLSAFE_DATABASE_URL: sqlite:////app/data/allsafe.db
    ALLSAFE_INITIALIZE_SCHEMA: "false"
    ALLSAFE_AUTHENTICATION_MODE: local
    ALLSAFE_INITIAL_ADMIN_EMAIL: ${ALLSAFE_ADMIN_EMAIL:?}
    ALLSAFE_INITIAL_ADMIN_PASSWORD: ${ALLSAFE_ADMIN_PASSWORD:?}
    ALLSAFE_FRONTEND_URL: ${ALLSAFE_ORIGIN:?}
    ALLSAFE_API_URL: ${ALLSAFE_ORIGIN:?}
    ALLSAFE_COOKIE_SECURE: "true"
    ALLSAFE_SESSION_SIGNING_SECRET: ${ALLSAFE_SESSION_SECRET:?}
    ALLSAFE_PHISHCATCH_URL: http://127.0.0.1:9000
    ALLSAFE_PHISHCATCH_ALLOW_LOOPBACK_HTTP: "true"
    ALLSAFE_PHISHCATCH_INTEGRATION_KEY: ${ALLSAFE_INTEGRATION_KEY:?}
    ALLSAFE_PHISHCATCH_TIMEOUT_SECONDS: "60"
    # Read-only Wazuh accounts; upstream TLS is verified by the link sidecar.
    ALLSAFE_WAZUH_SERVER_URL: http://127.0.0.1:55001
    ALLSAFE_WAZUH_SERVER_USERNAME: allsafe-reader
    ALLSAFE_WAZUH_SERVER_PASSWORD: ${WAZUH_SERVER_PASSWORD:-}
    ALLSAFE_WAZUH_INDEXER_URL: http://127.0.0.1:9201
    ALLSAFE_WAZUH_INDEXER_USERNAME: allsafe-reader
    ALLSAFE_WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
    ALLSAFE_WAZUH_ALLOW_LOOPBACK_HTTP: "true"
  volumes:
    - api-data:/app/data
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    restart: "no"
    mem_limit: 384m

  api:
    <<: *api
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.5"
    networks: [default, phishcatch-link, wazuh]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 30s

  phishcatch_link:
    image: nginx:stable-alpine
    network_mode: service:api
    depends_on:
      api: {condition: service_healthy, restart: true}
    volumes:
      - ./phishcatch-link.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wazuh-link.conf:/etc/nginx/conf.d/wazuh-link.conf:ro
      - ./wazuh-api.crt:/etc/nginx/wazuh/api.crt:ro
      - ./wazuh-root-ca.pem:/etc/nginx/wazuh/root-ca.pem:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m,mode=1777
      - /var/run:size=1m,mode=1777
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 9000 && nc -z 127.0.0.1 55001 && nc -z 127.0.0.1 9201"]
      interval: 30s
      timeout: 8s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  edge:
    image: allsafe-edge:${RELEASE:?Set RELEASE in release.env}
    ports:
      - "127.0.0.1:18180:80"
    volumes:
      - ./downloads:/usr/share/nginx/downloads:ro
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
    mem_limit: 128m
    cpus: "0.5"
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/health/ready]
      interval: 30s
      timeout: 8s
      retries: 3

networks:
  phishcatch-link:
    external: true
  wazuh:
    name: wazuh_default
    external: true

volumes:
  api-data:
