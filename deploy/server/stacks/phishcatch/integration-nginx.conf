# Server-to-server ALLSAFE integration only. Published to the tailnet; every other path is 404.
server {
    listen 18190;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    location = /api/v1/integrations/allsafe/analyze {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host phishcatch;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 90s;
    }
    location = /api/v1/integrations/allsafe/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host phishcatch;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
