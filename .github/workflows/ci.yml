name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'hotfix/**', 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-checks:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # API checks do not require fetching or running upstream PhishCatch.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.lock
          python -m pip install --no-deps -e apps/api
      - name: Lint and formatting
        run: |
          python -m ruff check apps/api scripts/demo_enrollment.py
          python -m ruff format --check apps/api scripts/demo_enrollment.py
      - name: API behavior tests
        run: python -m pytest apps/api/tests -q
      - name: Database migration
        working-directory: apps/api
        env:
          ALLSAFE_DATABASE_URL: sqlite:///./data/migration-check.db
          ALLSAFE_INITIALIZE_SCHEMA: 'false'
        run: |
          python -m alembic upgrade head
          python -m alembic check

  web-checks:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Browser authentication and role behavior
        run: npm test
      - name: Type check and production bundle
        run: npm run build

  agent-checks:
    name: Agent checks
    runs-on: windows-latest
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/.local/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/.local/nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
      - name: Locked agent dependencies
        run: dotnet restore apps/agent/Allsafe.Agent.Tests/Allsafe.Agent.Tests.csproj --locked-mode
      - name: Protocol and Windows credential tests
        run: dotnet test apps/agent/Allsafe.Agent.Tests/Allsafe.Agent.Tests.csproj --no-restore --configuration Release
      - name: Package integrity and path safety tests
        run: .\scripts\test-agent-package.ps1
      - name: Windows package
        run: .\scripts\publish-agent.ps1
